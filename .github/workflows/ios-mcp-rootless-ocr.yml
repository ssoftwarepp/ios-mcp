name: Build iOS MCP Rootless with PaddleOCR

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-mcp-rootless-ocr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-rootless:
    # Xcode 16.4 is required by docs/PADDLEOCR.md.
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Verify Apple toolchain
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sudo xcodebuild -license accept

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          brew update
          brew install cmake ninja ldid dpkg fakeroot xz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Theos and iOS SDKs
        shell: bash
        run: |
          set -euxo pipefail
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          test -d "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk"
          cp -R "$RUNNER_TEMP/theos-sdks/iPhoneOS16.5.sdk" "$HOME/theos/sdks/"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

          # The project Makefile references this SDK path for its Preferences framework.
          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Fetch checksum-pinned OCR sources and models
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .codex-session-data/paddle-build
          curl -fL --retry 3 --retry-all-errors --max-time 1200 \
            https://github.com/ssoftwarepp/ios-mcp/releases/download/ocr-source-onnxruntime-1.20.1/onnxruntime-1.20.1.tar.gz \
            -o .codex-session-data/paddle-build/onnxruntime-1.20.1.tar.gz
          echo 'd4c005506a2bbf88a838b14f8d1578406b8be2fb64abb50beeff908fb272529e  .codex-session-data/paddle-build/onnxruntime-1.20.1.tar.gz' | shasum -a 256 -c -
          python3 scripts/fetch_paddle_dependencies.py

      - name: Prepare pinned PaddleOCR models
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m venv .codex-session-data/paddle-build/venv
          .codex-session-data/paddle-build/venv/bin/python -m pip install --upgrade pip
          .codex-session-data/paddle-build/venv/bin/python -m pip install \
            onnx==1.17.0 \
            numpy==1.26.4 \
            PyYAML==6.0.2 \
            Pillow==11.1.0 \
            protobuf==6.33.6
          .codex-session-data/paddle-build/venv/bin/python scripts/prepare_paddleocr.py

      - name: Build iOS ARM64 ONNX Runtime and OpenCV static libraries
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/build_paddle_runtime.sh ios

      - name: Upload iOS ARM64 static libraries
        uses: actions/upload-artifact@v4
        with:
          name: ios-mcp-paddleocr-static-libs-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            third_party/paddleocr/runtime/ios/lib/libonnxruntime.a
            third_party/paddleocr/runtime/ios/opencv/lib/libopencv_core.a
            third_party/paddleocr/runtime/ios/opencv/lib/libopencv_imgproc.a

      - name: Build and audit OCR worker
        shell: bash
        run: |
          set -euxo pipefail
          make -C mcp-ocr-worker
          python3 scripts/check_paddle_binaries.py

      - name: Run OCR unit tests
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/test_ocr_unit.sh

      - name: Build iOS ARM64 libzip 1.7.3 for package helpers
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-all-errors --max-time 300 \
            https://codeload.github.com/nih-at/libzip/tar.gz/66e496489bdae81bfda8b0088172871d8fda0032 \
            -o "$RUNNER_TEMP/libzip-1.7.3.tar.gz"
          echo "fbc958c231a681eb0c4b05bad4b400c02493bbba0bafda52d8a0d9b2c1d3d5b0  $RUNNER_TEMP/libzip-1.7.3.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/libzip-1.7.3.tar.gz" -C "$RUNNER_TEMP"
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          cmake -S "$RUNNER_TEMP/libzip-66e496489bdae81bfda8b0088172871d8fda0032" -B "$RUNNER_TEMP/libzip-build" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT="$sdk" -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TOOLS=OFF -DBUILD_REGRESS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOC=OFF \
            -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF \
            -DENABLE_BZIP2=OFF -DENABLE_LZMA=OFF -DLIBZIP_DO_INSTALL=OFF
          cmake --build "$RUNNER_TEMP/libzip-build" --target zip --parallel 4
          mkdir -p "$THEOS/lib"
          cp "$RUNNER_TEMP/libzip-build/lib/libzip.a" "$THEOS/lib/libzip.a"
          test -s "$THEOS/lib/libzip.a"
          xcrun lipo -archs "$THEOS/lib/libzip.a"
          xcrun otool -l "$THEOS/lib/libzip.a" > "$RUNNER_TEMP/libzip-load-commands.txt"
          grep -A 5 LC_BUILD_VERSION "$RUNNER_TEMP/libzip-load-commands.txt" | sed -n '1,8p'

      - name: Build Rootless release DEB
        shell: bash
        run: |
          set -euxo pipefail
          printf '2\n1\n' | ./build.sh
          ls -lah packages/*.deb

      - name: Verify package resources and assemble complete artifact
        shell: bash
        run: |
          set -euxo pipefail
          bundle="$GITHUB_WORKSPACE/artifacts/ios-mcp-rootless-paddleocr"
          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$bundle" "$bundle/deb-root" "$bundle/packages" "$bundle/runtime" "$bundle/models" "$bundle/sources"

          deb="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          test "$(find packages -maxdepth 1 -type f -name '*.deb' | wc -l | tr -d ' ')" = 1
          dpkg-deb --info "$deb" > "$bundle/package-control.txt"
          dpkg-deb --contents "$deb" > "$bundle/package-contents.txt"
          dpkg-deb --extract "$deb" "$bundle/deb-root"

          package_root="$bundle/deb-root"
          if test -d "$package_root/var/jb"; then package_root="$package_root/var/jb"; fi
          test -x "$package_root/usr/libexec/ios-mcp/mcp-ocr-worker"
          test -f "$package_root/usr/share/ios-mcp/paddleocr/det.onnx"
          test -f "$package_root/usr/share/ios-mcp/paddleocr/rec.onnx"
          test -f "$package_root/usr/share/ios-mcp/paddleocr/dictionary.json"
          test -f "$package_root/usr/share/ios-mcp/paddleocr/sha256.json"
          test -f third_party/paddleocr/runtime/ios/lib/libonnxruntime.a
          test -f third_party/paddleocr/runtime/ios/opencv/lib/libopencv_core.a
          test -f third_party/paddleocr/runtime/ios/opencv/lib/libopencv_imgproc.a
          test -f .codex-session-data/paddle-build/binary-audit.json

          cp "$deb" "$bundle/packages/"
          cp -R third_party/paddleocr/models/. "$bundle/models/"
          cp -R third_party/paddleocr/runtime/ios/. "$bundle/runtime/"
          cp -R third_party/paddleocr/clipper "$bundle/clipper"
          cp third_party/paddleocr/dependencies.lock.json "$bundle/"
          cp third_party/paddleocr/LICENSE* third_party/paddleocr/ONNXRuntime-ThirdPartyNotices.txt "$bundle/"
          cp .codex-session-data/paddle-build/binary-audit.json "$bundle/"
          cp mcp-ocr-worker/.theos/obj/mcp-ocr-worker "$bundle/"
          cp .codex-session-data/paddle-build/onnxruntime-1.20.1.tar.gz "$bundle/sources/"
          cp .codex-session-data/paddle-build/opencv-4.10.0.tar.gz "$bundle/sources/"
          cp .codex-session-data/paddle-build/eigen.zip "$bundle/sources/"

          (
            cd "$bundle"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          )
          du -sh "$bundle"
          find "$bundle" -type f -print | sort

      - name: Upload complete Rootless build bundle
        uses: actions/upload-artifact@v4
        with:
          name: ios-mcp-rootless-paddleocr-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/ios-mcp-rootless-paddleocr
